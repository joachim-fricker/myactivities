name: Garmin Auto Sync
on:
 workflow_dispatch:
    inputs:
      limit:
        description: 'Anzahl der maximal zu ladenden Aktivitäten'
        required: true
        default: '5'
        type: string
jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade garminconnect curl_cffi
 
   
      - name: Garmin Sync Skript ausführen
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          GARMINTOKENS: ".garminconnect" # Speichert die Tokens direkt im Repo, damit keine erneute Anmeldung nötig ist
        run: |
          python exporter.py ${{ github.event.inputs.limit }}

      - name: Änderungen (Neue Aktivitäten & Tokens) automatisch committen
        run: |
          git config --global user.name "Garmin Bot"
          git config --global user.email "bot@users.noreply.github.com"
          
          # Vor dem Pull lokale Änderungen nicht blockieren lassen
          git add activities/ .garminconnect/
          git stash || true
          git pull origin main --rebase || true
          git stash pop || true
          
          git add activities/ .garminconnect/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync: Neue Garmin Aktivitäten" && git push origin main)
